# ============================================================
# ros2_control 控制器配置
# ============================================================

controller_manager:
  ros__parameters:
    # 仿真时间更新频率 (Hz)
    update_rate: 50

    # ---- 差速驱动控制器 ----
    diff_cont:
      type: diff_drive_controller/DiffDriveController

    # ---- 关节状态广播器 ----
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster


# ============================================================
# 差速驱动控制器参数
# 订阅控制器私有话题 /diff_cont/cmd_vel（TwistStamped），
# launch 中的 cmd_vel_relay 会把键盘默认发布的 /cmd_vel 转发到该话题，
# 将线速度和角速度转换为左右轮的转速命令
# ============================================================
diff_cont:
  ros__parameters:
    # 轮子参数（与 URDF 中 robot_core.xacro 保持一致）
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheels_per_side: 1          # 每侧一个独立控制信号；默认 0 会使轮速计算失效
    wheel_separation: 0.35      # 左右轮间距（左轮到右轮的水平距离，单位：米）
    wheel_radius: 0.05          # 轮子半径（用于将线速度/角速度转换为轮子转速，单位：米）

    # 线速度和角速度上限（防止速度指令过大）
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0

    # 里程计发布参数
    publish_rate: 50.0          # 里程计消息发布频率 (Hz)
    odom_frame_id: odom         # 里程计坐标系名称
    base_frame_id: base_footprint    # 机器人基座坐标系名称
    enable_odom_tf: true        # 是否发布 odom → base_link 的 TF 变换

    # 使用带仿真时间戳的命令，避免 Humble 回移植版本的 unstamped 通道失效
    use_stamped_vel: true
    publish_limited_velocity: true


# ============================================================
# 关节状态广播器参数
# 广播所有关节的实时位置和速度状态到 /joint_states 话题
# （robot_state_publisher 订阅此话题来更新 TF 树）
# ============================================================
joint_broad:
  ros__parameters: {}
